name: Migraciones Supabase

# Aplica las migraciones de supabase/migrations a la BD de producción al mergear a main.
# Requiere dos secrets del repo: SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vktjjehjdpcliwxwjbzu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Enlazar proyecto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Aplicar migraciones
        run: supabase db push
